
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SW 상품조회</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, "Malgun Gothic", sans-serif;
      background: #f4f6f9;
      color: #222;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.07);
    }

    h1 {
      text-align: center;
      margin: 0 0 25px;
      font-size: 28px;
    }

    .login-area {
      max-width: 360px;
      margin: 60px auto;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .login-area button {
      width: 100%;
      margin-top: 12px;
    }

    .search-area {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .search-area input {
      flex: 1;
      min-width: 0;
    }

    .search-area button {
      white-space: nowrap;
    }

    .info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
      color: #666;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
    }

    table {
      width: 100%;
      min-width: 600px;
      border-collapse: collapse;
      font-size: 14px;
    }

    th {
      background: #f1f5f9;
      font-weight: bold;
      padding: 13px 10px;
      border-bottom: 1px solid #ddd;
      white-space: nowrap;
    }

    td {
      padding: 12px 10px;
      border-bottom: 1px solid #eee;
      text-align: center;
    }

    tr:last-child td {
      border-bottom: none;
    }

    td:nth-child(3) {
      text-align: left;
      min-width: 220px;
    }

    .message {
      padding: 25px 10px;
      text-align: center;
      color: #777;
    }

    .error {
      color: #dc2626;
      margin-top: 12px;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }

    .refresh-info {
      font-size: 12px;
      color: #999;
      text-align: right;
      margin-top: 12px;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 18px 12px;
        margin: 10px auto;
      }

      h1 {
        font-size: 23px;
      }

      .search-area {
        flex-wrap: wrap;
      }

      .search-area input {
        width: 100%;
        flex-basis: 100%;
      }

      .search-area button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>SW 상품조회</h1>

    <!-- 로그인 -->
    <div id="loginArea" class="login-area">
      <input
        type="password"
        id="password"
        placeholder="비밀번호를 입력하세요"
        onkeydown="if(event.key === 'Enter') login()"
      >
      <button onclick="login()">로그인</button>
      <div id="loginError" class="error"></div>
    </div>

    <!-- 상품 조회 -->
    <div id="mainArea" class="hidden">

      <div class="search-area">
        <input
          type="text"
          id="searchInput"
          placeholder="상품명 또는 바코드를 입력하세요"
          onkeydown="if(event.key === 'Enter') searchProducts()"
        >
        <button onclick="searchProducts()">검색</button>
        <button onclick="resetSearch()" style="background:#64748b;">초기화</button>
      </div>

      <div class="info">
        <span id="resultCount">상품 데이터를 불러오는 중입니다.</span>
        <span id="loadingStatus"></span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>상품분류</th>
              <th>바코드</th>
              <th>상품명</th>
              <th>규격</th>
              <th>소매가</th>
            </tr>
          </thead>
          <tbody id="productTable">
            <tr>
              <td colspan="5" class="message">
                상품 데이터를 불러오는 중입니다.
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="refresh-info">
        상품 정보는 60초마다 자동으로 갱신됩니다.
      </div>

    </div>
  </div>

<script>
  // 기본 설정
  const PASSWORD = "2221";

  const SPREADSHEET_ID =
    "12vYM5rzLo_bCiKipLJfX-io3c9ycI9cW18ST07_d6GY";

  const GID = "0";

  const REFRESH_INTERVAL = 60000;

  let products = [];
  let refreshTimer = null;
  let isLoading = false;

  // 로그인
  function login() {
    const password = document.getElementById("password").value;

    if (password === PASSWORD) {
      document.getElementById("loginArea").classList.add("hidden");
      document.getElementById("mainArea").classList.remove("hidden");

      loadProducts();

      if (!refreshTimer) {
        refreshTimer = setInterval(loadProducts, REFRESH_INTERVAL);
      }
    } else {
      document.getElementById("loginError").textContent =
        "비밀번호가 올바르지 않습니다.";
    }
  }

  // 셀 값 가져오기
  function getCellValue(cell) {
    if (!cell) return "";

    if (cell.f !== undefined && cell.f !== null) {
      return String(cell.f).trim();
    }

    if (cell.v !== undefined && cell.v !== null) {
      return String(cell.v).trim();
    }

    return "";
  }

  // 구글시트 JSONP 데이터 불러오기
  function loadProducts() {
    if (isLoading) return;

    isLoading = true;

    document.getElementById("loadingStatus").textContent =
      "데이터 갱신 중...";

    const oldCallback = window.google &&
      window.google.visualization &&
      window.google.visualization.Query &&
      window.google.visualization.Query.setResponse;

    let finished = false;
    let script = null;
    let timeout = null;

    function finish() {
      if (finished) return;

      finished = true;
      isLoading = false;

      if (script) {
        script.remove();
      }

      if (timeout) {
        clearTimeout(timeout);
      }

      if (oldCallback) {
        window.google.visualization.Query.setResponse = oldCallback;
      } else if (
        window.google &&
        window.google.visualization &&
        window.google.visualization.Query
      ) {
        delete window.google.visualization.Query.setResponse;
      }
    }

    window.google = window.google || {};
    window.google.visualization =
      window.google.visualization || {};
    window.google.visualization.Query =
      window.google.visualization.Query || {};

    window.google.visualization.Query.setResponse = function(response) {
      if (finished) return;

      try {
        if (!response || response.status !== "ok") {
          throw new Error("구글시트 응답 오류");
        }

        const rows = response.table.rows || [];

        const loadedProducts = [];

        rows.forEach(function(row) {
          const cells = row.c || [];

          // 첫 번째 행은 제목이므로 제외
          const firstValue = getCellValue(cells[0]);

          if (firstValue === "상품분류") {
            return;
          }

          const product = {
            category: getCellValue(cells[0]),
            barcode: getCellValue(cells[1]),
            name: getCellValue(cells[2]),
            size: getCellValue(cells[3]),
            price: getCellValue(cells[4])
          };

          // 상품명이 없는 빈 행은 제외
          if (!product.name && !product.barcode) {
            return;
          }

          loadedProducts.push(product);
        });

        products = loadedProducts;

        finish();

        document.getElementById("loadingStatus").textContent =
          "연결 완료";

        searchProducts();

      } catch (error) {
        finish();

        document.getElementById("loadingStatus").textContent =
          "데이터 처리 실패";

        document.getElementById("productTable").innerHTML =
          '<tr><td colspan="5" class="message">상품 데이터를 처리하지 못했습니다.</td></tr>';

        document.getElementById("resultCount").textContent =
          "데이터 처리 오류";

        console.error(error);
      }
    };

    const url =
      "https://docs.google.com/spreadsheets/d/" +
      SPREADSHEET_ID +
      "/gviz/tq?tqx=out:json&gid=" +
      GID +
      "&headers=0";

    script = document.createElement("script");
    script.src = url;
    script.onerror = function() {
      if (finished) return;

      finish();

      document.getElementById("loadingStatus").textContent =
        "연결 실패";

      document.getElementById("resultCount").textContent =
        "구글시트 연결에 실패했습니다. 주소와 공유 설정을 확인해 주세요.";

      document.getElementById("productTable").innerHTML =
        '<tr><td colspan="5" class="message">데이터를 불러오지 못했습니다.</td></tr>';
    };

    timeout = setTimeout(function() {
      if (finished) return;

      finish();

      document.getElementById("loadingStatus").textContent =
        "응답 시간 초과";

      document.getElementById("resultCount").textContent =
        "구글시트 응답이 지연되고 있습니다. 다시 시도해 주세요.";

    }, 15000);

    document.head.appendChild(script);
  }

  // 바코드 앞자리 0 제거
  function normalizeBarcode(value) {
    return String(value)
      .replace(/\D/g, "")
      .replace(/^0+/, "");
  }

  // 상품 검색
  function searchProducts() {
    const keyword = document
      .getElementById("searchInput")
      .value
      .trim();

    let filteredProducts = products;

    if (keyword) {
      const isBarcode = /^\d+$/.test(keyword);

      if (isBarcode) {
        const searchBarcode = normalizeBarcode(keyword);

        filteredProducts = products.filter(function(product) {
          return normalizeBarcode(product.barcode) === searchBarcode;
        });

      } else {
        const searchName = keyword.toLowerCase();

        filteredProducts = products.filter(function(product) {
          return product.name.toLowerCase().includes(searchName);
        });
      }
    }

    renderProducts(filteredProducts);
  }

  // 결과 표시
  function renderProducts(list) {
    const tbody = document.getElementById("productTable");

    document.getElementById("resultCount").textContent =
      "검색 결과 " + list.length + "개";

    if (list.length === 0) {
      tbody.innerHTML =
        '<tr><td colspan="5" class="message">검색 결과가 없습니다.</td></tr>';
      return;
    }

    tbody.innerHTML = list.map(function(product) {
      return `
        <tr>
          <td>${escapeHTML(product.category)}</td>
          <td>${escapeHTML(product.barcode)}</td>
          <td>${escapeHTML(product.name)}</td>
          <td>${escapeHTML(product.size)}</td>
          <td>${escapeHTML(product.price)}</td>
        </tr>
      `;
    }).join("");
  }

  // HTML 특수문자 처리
  function escapeHTML(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  // 검색 초기화
  function resetSearch() {
    document.getElementById("searchInput").value = "";
    searchProducts();
  }

</script>

</body>
</html>
