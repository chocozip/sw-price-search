
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SW 상품조회</title>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 25px 15px;
  font-family: Arial, "Malgun Gothic", sans-serif;
  background: #f5f6f8;
  color: #222;
}

.container {
  max-width: 1000px;
  margin: auto;
}

h1 {
  text-align: center;
  margin-bottom: 25px;
}

.panel {
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 2px 10px rgba(0,0,0,.06);
  margin-bottom: 20px;
}

.login-box {
  max-width: 400px;
  margin: 70px auto;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 7px;
  font-size: 16px;
}

button {
  border: none;
  border-radius: 7px;
  padding: 13px 20px;
  font-size: 15px;
  cursor: pointer;
  background: #3478f6;
  color: white;
}

.login-btn {
  width: 100%;
  margin-top: 12px;
}

.top-area {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.logout-btn {
  background: #777;
}

.search-area {
  display: flex;
  gap: 10px;
}

.search-area input {
  flex: 1;
  min-width: 0;
}

.status {
  margin-top: 15px;
  font-size: 14px;
  color: #666;
  white-space: pre-wrap;
}

.error {
  color: #d93025;
}

.result-count {
  margin: 20px 0 12px;
  font-weight: bold;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  min-width: 600px;
  border-collapse: collapse;
}

th, td {
  padding: 13px 10px;
  border-bottom: 1px solid #eee;
  text-align: center;
  font-size: 14px;
}

th {
  background: #f0f3f8;
}

td:nth-child(3) {
  text-align: left;
}

.empty {
  padding: 40px 10px;
  text-align: center;
  color: #888;
}

.hidden {
  display: none;
}

@media(max-width:600px) {
  .panel { padding: 17px; }
  .search-area { flex-direction: column; }
  .search-area button { width: 100%; }
}
</style>
</head>

<body>

<div class="container">

<h1>SW 상품조회</h1>

<div id="loginSection" class="panel login-box">
  <h3>비밀번호 입력</h3>
  <input type="password" id="password"
         placeholder="비밀번호를 입력하세요">

  <button class="login-btn" id="loginButton">로그인</button>
  <div id="loginStatus" class="status"></div>
</div>

<div id="mainSection" class="hidden">

  <div class="panel">

    <div class="top-area">
      <strong>상품 검색</strong>
      <button class="logout-btn" id="logoutButton">로그아웃</button>
    </div>

    <div class="search-area">
      <input id="searchInput"
             placeholder="상품명 또는 바코드를 입력하세요">
      <button id="searchButton">검색</button>
    </div>

    <div id="status" class="status">
      상품 데이터를 불러오는 중입니다.
    </div>

    <div id="resultCount" class="result-count"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>상품분류</th>
            <th>바코드</th>
            <th>상품명</th>
            <th>규격</th>
            <th>소매가</th>
          </tr>
        </thead>
        <tbody id="productList">
          <tr>
            <td colspan="5" class="empty">불러오는 중입니다.</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>

</div>

<script>

// 상품 데이터 주소
const SHEET_URL =
"https://docs.google.com/spreadsheets/d/12vYM5rzLo_bCiKipLJfX-io3c9ycI9cW18ST07_d6GY/export?format=csv&gid=0";

// 로그인 비밀번호
const PASSWORD = "2221";

let products = [];
let refreshTimer = null;


// 로그인
function login() {
  const password = document.getElementById("password").value;

  if (password !== PASSWORD) {
    document.getElementById("loginStatus").textContent =
      "비밀번호가 올바르지 않습니다.";
    document.getElementById("loginStatus").className =
      "status error";
    return;
  }

  sessionStorage.setItem("sw_login", "true");
  document.getElementById("password").value = "";

  showMain();
  loadProducts();
}


// 화면 표시
function showMain() {
  document.getElementById("loginSection").classList.add("hidden");
  document.getElementById("mainSection").classList.remove("hidden");
}


// 로그아웃
function logout() {
  sessionStorage.removeItem("sw_login");

  if (refreshTimer) {
    clearInterval(refreshTimer);
    refreshTimer = null;
  }

  products = [];

  document.getElementById("mainSection").classList.add("hidden");
  document.getElementById("loginSection").classList.remove("hidden");
  document.getElementById("productList").innerHTML = "";
  document.getElementById("resultCount").textContent = "";
  document.getElementById("status").textContent = "";
}


// 상품 데이터 가져오기
async function loadProducts() {
  const status = document.getElementById("status");

  status.textContent = "상품 데이터를 불러오는 중입니다.";
  status.className = "status";

  try {
    const response = await fetch(
      SHEET_URL + "&cache=" + Date.now()
    );

    if (!response.ok) {
      throw new Error("구글시트 응답 오류: " + response.status);
    }

    const csv = await response.text();

    const parsed = Papa.parse(csv, {
      header: true,
      skipEmptyLines: true
    });

    if (parsed.errors.length) {
      console.warn("CSV 확인:", parsed.errors);
    }

    const rows = parsed.data;

    if (!rows.length) {
      throw new Error("상품 데이터가 없습니다.");
    }

    const headers = Object.keys(rows[0]).map(v => v.trim());

    const required = [
      "상품분류", "바코드", "상품명", "규격", "소매가"
    ];

    required.forEach(name => {
      if (!headers.includes(name)) {
        throw new Error(
          "구글시트에서 '" + name + "' 열을 찾을 수 없습니다."
        );
      }
    });

    products = rows.map(row => ({
      category: row["상품분류"] || "",
      barcode: row["바코드"] || "",
      name: row["상품명"] || "",
      size: row["규격"] || "",
      price: row["소매가"] || ""
    }));

    status.textContent =
      "상품 " + products.length.toLocaleString() + "개 불러오기 완료";

    searchProducts();

    if (!refreshTimer) {
      refreshTimer = setInterval(loadProducts, 60000);
    }

  } catch (error) {
    status.textContent =
      "상품 데이터를 불러오지 못했습니다.\n" + error.message;

    status.className = "status error";
  }
}


// 바코드 앞자리 0 제거
function normalizeBarcode(value) {
  return String(value || "").trim().replace(/^0+/, "");
}


// 상품 검색
function searchProducts() {
  const keyword =
    document.getElementById("searchInput").value.trim();

  const tbody = document.getElementById("productList");
  const count = document.getElementById("resultCount");

  let filtered = products;

  if (keyword) {
    const barcodeKeyword = normalizeBarcode(keyword);

    filtered = products.filter(item => {
      const nameMatch =
        String(item.name).toLowerCase().includes(keyword.toLowerCase());

      const barcodeMatch =
        barcodeKeyword !== "" &&
        normalizeBarcode(item.barcode) === barcodeKeyword;

      return nameMatch || barcodeMatch;
    });
  }

  count.textContent =
    "검색 결과 : " + filtered.length.toLocaleString() + "개";

  if (!filtered.length) {
    tbody.innerHTML =
      '<tr><td colspan="5" class="empty">검색 결과가 없습니다.</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(item => `
    <tr>
      <td>${escapeHTML(item.category)}</td>
      <td>${escapeHTML(item.barcode)}</td>
      <td>${escapeHTML(item.name)}</td>
      <td>${escapeHTML(item.size)}</td>
      <td>${escapeHTML(item.price)}</td>
    </tr>
  `).join("");
}


// HTML 특수문자 처리
function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


// 버튼 연결
document.getElementById("loginButton").onclick = login;
document.getElementById("logoutButton").onclick = logout;
document.getElementById("searchButton").onclick = searchProducts;

document.getElementById("password").addEventListener("keydown", e => {
  if (e.key === "Enter") login();
});

document.getElementById("searchInput").addEventListener("keydown", e => {
  if (e.key === "Enter") searchProducts();
});


// 페이지 시작
window.onload = function() {
  if (sessionStorage.getItem("sw_login") === "true") {
    showMain();
    loadProducts();
  }
};

</script>

</body>
</html>
