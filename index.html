
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SW 상품조회</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px 15px;
  font-family: Arial, "Malgun Gothic", sans-serif;
  background: #f5f6f8;
  color: #222;
}

.container {
  max-width: 1000px;
  margin: auto;
}

h1 {
  text-align: center;
  margin-bottom: 25px;
}

.panel {
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 2px 10px rgba(0,0,0,.06);
  margin-bottom: 20px;
}

.login-box {
  max-width: 400px;
  margin: 70px auto;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 7px;
  font-size: 16px;
}

button {
  border: none;
  border-radius: 7px;
  padding: 13px 20px;
  font-size: 15px;
  cursor: pointer;
  background: #3478f6;
  color: white;
}

.login-btn {
  width: 100%;
  margin-top: 12px;
}

.top-area {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.logout-btn {
  background: #777;
}

.search-area {
  display: flex;
  gap: 10px;
}

.search-area input {
  flex: 1;
  min-width: 0;
}

.status {
  margin-top: 15px;
  font-size: 14px;
  color: #666;
  white-space: pre-wrap;
}

.error {
  color: #d93025;
}

.result-count {
  margin: 20px 0 12px;
  font-weight: bold;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  min-width: 600px;
  border-collapse: collapse;
}

th, td {
  padding: 13px 10px;
  border-bottom: 1px solid #eee;
  text-align: center;
  font-size: 14px;
}

th {
  background: #f0f3f8;
}

td:nth-child(3) {
  text-align: left;
}

.empty {
  padding: 40px 10px;
  text-align: center;
  color: #888;
}

.hidden {
  display: none;
}

@media(max-width:600px) {
  .panel {
    padding: 17px;
  }

  .search-area {
    flex-direction: column;
  }

  .search-area button {
    width: 100%;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>SW 상품조회</h1>

<!-- 로그인 -->
<div id="loginSection" class="panel login-box">

  <h3>비밀번호 입력</h3>

  <input
    type="password"
    id="password"
    placeholder="비밀번호를 입력하세요"
  >

  <button class="login-btn" id="loginButton">
    로그인
  </button>

  <div id="loginStatus" class="status"></div>

</div>


<!-- 상품 조회 -->
<div id="mainSection" class="hidden">

  <div class="panel">

    <div class="top-area">

      <strong>상품 검색</strong>

      <button class="logout-btn" id="logoutButton">
        로그아웃
      </button>

    </div>

    <div class="search-area">

      <input
        id="searchInput"
        placeholder="상품명 또는 바코드를 입력하세요"
      >

      <button id="searchButton">
        검색
      </button>

    </div>

    <div id="status" class="status">
      상품 데이터를 불러오는 중입니다.
    </div>

    <div id="resultCount" class="result-count"></div>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>상품분류</th>
            <th>바코드</th>
            <th>상품명</th>
            <th>규격</th>
            <th>소매가</th>
          </tr>
        </thead>

        <tbody id="productList">

          <tr>
            <td colspan="5" class="empty">
              불러오는 중입니다.
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>

</div>


<script>

// ======================================
// 기본 설정
// ======================================

// 구글시트 게시 ID
const SHEET_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSF33djCdRyww39H6auYsPKz4dcxCynxA1ET0VfZVwAhjFcOJVx2MnyFVXEOXkfiOmXQVOdesLosz91/gviz/tq?tqx=out:json&gid=0";

// 로그인 비밀번호
const PASSWORD = "2221";

// 상품 데이터
let products = [];

// 자동 갱신 타이머
let refreshTimer = null;

// 중복 요청 방지
let isLoading = false;

// 요청 시간 제한 타이머
let requestTimer = null;


// ======================================
// 로그인
// ======================================

function login() {

  const password =
    document.getElementById("password").value;

  if (password !== PASSWORD) {

    document.getElementById("loginStatus").textContent =
      "비밀번호가 올바르지 않습니다.";

    document.getElementById("loginStatus").className =
      "status error";

    return;
  }

  sessionStorage.setItem("sw_login", "true");

  document.getElementById("password").value = "";

  showMain();

  loadProducts();
}


// ======================================
// 화면 표시
// ======================================

function showMain() {

  document.getElementById("loginSection")
    .classList.add("hidden");

  document.getElementById("mainSection")
    .classList.remove("hidden");
}


// ======================================
// 로그아웃
// ======================================

function logout() {

  sessionStorage.removeItem("sw_login");

  if (refreshTimer) {
    clearInterval(refreshTimer);
    refreshTimer = null;
  }

  if (requestTimer) {
    clearTimeout(requestTimer);
    requestTimer = null;
  }

  products = [];

  document.getElementById("mainSection")
    .classList.add("hidden");

  document.getElementById("loginSection")
    .classList.remove("hidden");

  document.getElementById("productList").innerHTML = "";

  document.getElementById("resultCount").textContent = "";

  document.getElementById("status").textContent = "";

  document.getElementById("loginStatus").textContent = "";
}


// ======================================
// 구글시트 데이터 불러오기
// JSONP 방식
// ======================================

function loadProducts() {

  if (isLoading) return;

  isLoading = true;

  const status =
    document.getElementById("status");

  status.textContent =
    "상품 데이터를 불러오는 중입니다.";

  status.className = "status";

  // 이전 요청 스크립트 제거
  const oldScript =
    document.getElementById("sheetScript");

  if (oldScript) {
    oldScript.remove();
  }

  if (requestTimer) {
    clearTimeout(requestTimer);
    requestTimer = null;
  }

  // 구글시트 응답 처리 함수
  window.google = window.google || {};

  window.google.visualization =
    window.google.visualization || {};

  window.google.visualization.Query = {

    setResponse: function(response) {

      if (!isLoading) return;

      try {

        if (!response || response.status !== "ok") {

          throw new Error(
            "구글시트에서 정상적인 응답을 받지 못했습니다."
          );

        }

        const table = response.table;

        if (!table || !table.cols || !table.rows) {

          throw new Error(
            "구글시트 데이터 구조를 확인할 수 없습니다."
          );

        }

        // 열 제목 가져오기
        let headers = table.cols.map(col =>
          String(col.label || "").trim()
        );

        const required = [
          "상품분류",
          "바코드",
          "상품명",
          "규격",
          "소매가"
        ];

        let startIndex = 0;

        // 열 제목이 첫 행에 들어 있는 경우 처리
        if (!required.every(name => headers.includes(name))) {

          const firstRow = table.rows[0];

          if (!firstRow || !firstRow.c) {

            throw new Error(
              "구글시트 열 제목을 확인해 주세요."
            );

          }

          const firstHeaders = firstRow.c.map(cell =>
            String(cell?.v ?? "").trim()
          );

          if (!required.every(name => firstHeaders.includes(name))) {

            throw new Error(
              "필요한 열 제목을 찾지 못했습니다.\n" +
              "필요한 열: " + required.join(", ")
            );

          }

          headers = firstHeaders;

          startIndex = 1;

        }

        // 각 열의 위치
        const indexes = {

          category: headers.indexOf("상품분류"),

          barcode: headers.indexOf("바코드"),

          name: headers.indexOf("상품명"),

          size: headers.indexOf("규격"),

          price: headers.indexOf("소매가")

        };


        // 셀 값 가져오기
        function getValue(row, index) {

          const cell = row.c[index];

          if (
            !cell ||
            cell.v === null ||
            cell.v === undefined
          ) {
            return "";
          }

          // 구글시트에서 표시하는 값 우선 사용
          return String(
            cell.f !== null && cell.f !== undefined
              ? cell.f
              : cell.v
          ).trim();

        }


        // 상품 데이터 정리
        products = table.rows
          .slice(startIndex)
          .map(row => {

            const cells = row.c || [];

            return {

              category: getValue(
                { c: cells },
                indexes.category
              ),

              barcode: getValue(
                { c: cells },
                indexes.barcode
              ),

              name: getValue(
                { c: cells },
                indexes.name
              ),

              // 규격이 비어 있으면 빈칸으로 유지
              size: getValue(
                { c: cells },
                indexes.size
              ),

              // 12,000과 같은 금액 쉼표 유지
              price: getValue(
                { c: cells },
                indexes.price
              )

            };

          })
          .filter(item =>
            item.name !== "" || item.barcode !== ""
          );


        // 조회 완료
        status.textContent =
          "상품 " +
          products.length.toLocaleString() +
          "개 불러오기 완료";

        status.className = "status";

        searchProducts();


        // 60초마다 자동 갱신
        if (!refreshTimer) {

          refreshTimer = setInterval(
            loadProducts,
            60000
          );

        }

      } catch (error) {

        console.error(error);

        status.textContent =
          "상품 데이터를 불러오지 못했습니다.\n" +
          error.message;

        status.className = "status error";

      } finally {

        isLoading = false;

        if (requestTimer) {
          clearTimeout(requestTimer);
          requestTimer = null;
        }

      }

    }

  };


  // 구글시트 요청 스크립트 생성
  const script = document.createElement("script");

  script.id = "sheetScript";

  script.src =
    SHEET_URL + "&cache=" + Date.now();

  script.onerror = function() {

    if (!isLoading) return;

    status.textContent =
      "구글시트 연결에 실패했습니다.\n" +
      "게시 설정 또는 구글시트 주소를 확인해 주세요.";

    status.className = "status error";

    isLoading = false;

    if (requestTimer) {
      clearTimeout(requestTimer);
      requestTimer = null;
    }

  };


  // 15초 응답 대기
  requestTimer = setTimeout(function() {

    if (!isLoading) return;

    status.textContent =
      "구글시트 응답 시간이 초과되었습니다.\n" +
      "게시 주소와 시트 공개 설정을 확인해 주세요.";

    status.className = "status error";

    isLoading = false;

    script.remove();

    requestTimer = null;

  }, 15000);


  document.body.appendChild(script);

}


// ======================================
// 바코드 앞자리 0 제거
// ======================================

function normalizeBarcode(value) {

  return String(value || "")
    .trim()
    .replace(/^0+/, "");

}


// ======================================
// 상품 검색
// ======================================

function searchProducts() {

  const keyword =
    document.getElementById("searchInput")
      .value.trim();

  const tbody =
    document.getElementById("productList");

  const count =
    document.getElementById("resultCount");

  let filtered = products;


  if (keyword) {

    const barcodeKeyword =
      normalizeBarcode(keyword);

    filtered = products.filter(item => {

      // 상품명 부분 일치
      const nameMatch =
        String(item.name)
          .toLowerCase()
          .includes(keyword.toLowerCase());

      // 바코드 전체 일치
      // 앞자리 0 무시
      const barcodeMatch =
        barcodeKeyword !== "" &&
        normalizeBarcode(item.barcode) === barcodeKeyword;

      return nameMatch || barcodeMatch;

    });

  }


  count.textContent =
    "검색 결과 : " +
    filtered.length.toLocaleString() +
    "개";


  if (!filtered.length) {

    tbody.innerHTML =
      '<tr><td colspan="5" class="empty">' +
      '검색 결과가 없습니다.' +
      '</td></tr>';

    return;

  }


  tbody.innerHTML = filtered.map(item => `

    <tr>
      <td>${escapeHTML(item.category)}</td>
      <td>${escapeHTML(item.barcode)}</td>
      <td>${escapeHTML(item.name)}</td>
      <td>${escapeHTML(item.size)}</td>
      <td>${escapeHTML(item.price)}</td>
    </tr>

  `).join("");

}


// ======================================
// HTML 특수문자 처리
// ======================================

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


// ======================================
// 버튼 연결
// ======================================

document.getElementById("loginButton").onclick = login;

document.getElementById("logoutButton").onclick = logout;

document.getElementById("searchButton").onclick = searchProducts;


// 비밀번호 입력 후 엔터
document.getElementById("password")
  .addEventListener("keydown", function(e) {

    if (e.key === "Enter") {
      login();
    }

  });


// 검색창에서 엔터
document.getElementById("searchInput")
  .addEventListener("keydown", function(e) {

    if (e.key === "Enter") {
      searchProducts();
    }

  });


// ======================================
// 페이지 시작
// ======================================

window.onload = function() {

  if (sessionStorage.getItem("sw_login") === "true") {

    showMain();

    loadProducts();

  }

};

</script>

</body>
</html>
