
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SW 상품조회</title>

  <!-- 바코드 인식 라이브러리 -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      padding: 20px;
      width: 100%;
      font-family: Arial, "Malgun Gothic", sans-serif;
      background: #f3f5f8;
      color: #222;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 26px;
      text-align: center;
    }

    /* 로그인 */
    #loginArea {
      max-width: 400px;
      margin: 80px auto;
      padding: 25px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      text-align: center;
    }

    #passwordInput {
      width: 100%;
      padding: 14px;
      margin: 15px 0;
      font-size: 18px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 13px 18px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #loginButton {
      width: 100%;
    }

    /* 검색 */
    .search-area {
      display: flex;
      gap: 8px;
      width: 100%;
      margin-bottom: 15px;
    }

    #searchInput {
      flex: 1;
      min-width: 0;
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
    }

    #searchButton {
      flex-shrink: 0;
      white-space: nowrap;
    }

    /* 모바일 카메라 버튼 - 기본 PC 숨김 */
    #scanButton {
      display: none;
      flex-shrink: 0;
      background: #16a34a;
      white-space: nowrap;
    }

    /* 바코드 스캐너 */
    #scannerArea {
      display: none;
      margin-bottom: 18px;
      padding: 12px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 8px;
    }

    #reader video {
      width: 100% !important;
      object-fit: cover;
    }

    .scanner-guide {
      text-align: center;
      font-size: 14px;
      color: #555;
      margin: 10px 0;
    }

    #stopScanButton {
      width: 100%;
      background: #dc2626;
      margin-top: 5px;
    }

    /* 정보 */
    .info-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      font-size: 14px;
      color: #666;
    }

    #resultCount {
      font-weight: bold;
      color: #2563eb;
    }

    /* PC 테이블 */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th {
      background: #e9efff;
      color: #333;
      padding: 14px 10px;
      font-size: 14px;
      border-bottom: 1px solid #ddd;
    }

    td {
      padding: 13px 10px;
      font-size: 14px;
      border-bottom: 1px solid #eee;
      text-align: center;
      word-break: break-word;
    }

    td.product-name {
      text-align: left;
      font-weight: bold;
    }

    td.price {
      font-weight: bold;
      color: #2563eb;
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: none;
    }

    /* 모바일 카드 */
    #mobileResults {
      display: none;
      width: 100%;
    }

    .product-card {
      width: 100%;
      min-width: 0;
      background: white;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      border: 1px solid #e9edf3;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 9px;
    }

    .category {
      display: inline-block;
      background: #eef2ff;
      color: #4f46e5;
      font-size: 12px;
      font-weight: bold;
      padding: 5px 8px;
      border-radius: 6px;
    }

    .card-price {
      font-size: 16px;
      font-weight: bold;
      color: #2563eb;
      white-space: nowrap;
    }

    .card-name {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.4;
      margin-bottom: 10px;
      word-break: break-word;
    }

    .card-info {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 13px;
      color: #666;
    }

    .card-info-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .card-label {
      flex-shrink: 0;
      width: 45px;
      color: #999;
    }

    .card-value {
      min-width: 0;
      word-break: break-all;
      color: #333;
    }

    .empty-message {
      padding: 30px 15px;
      text-align: center;
      color: #888;
      background: white;
      border-radius: 10px;
    }

    #statusMessage {
      margin-top: 12px;
      font-size: 13px;
      color: #888;
      text-align: center;
    }

    /* 모바일 화면 */
    @media screen and (max-width: 600px) {
      body {
        padding: 10px;
        width: 100%;
      }

      .container {
        width: 100%;
        max-width: 100%;
      }

      h1 {
        font-size: 22px;
        margin-bottom: 16px;
      }

      .search-area {
        gap: 5px;
      }

      #searchInput {
        padding: 12px 9px;
        font-size: 14px;
      }

      #searchButton {
        padding: 12px 11px;
        font-size: 14px;
      }

      /* 모바일에서만 카메라 버튼 표시 */
      #scanButton {
        display: block;
        padding: 12px 11px;
        font-size: 14px;
      }

      .info-area {
        font-size: 12px;
      }

      /* 모바일에서는 테이블 숨김 */
      .table-wrapper {
        display: none !important;
      }

      /* 모바일 카드 표시 */
      #mobileResults {
        display: block !important;
      }

      .product-card {
        padding: 12px;
        margin-bottom: 10px;
      }

      .card-name {
        font-size: 16px;
      }

      .card-price {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- 로그인 -->
    <div id="loginArea">
      <h1>SW 상품조회</h1>

      <input
        type="password"
        id="passwordInput"
        placeholder="비밀번호 입력"
        inputmode="numeric"
      >

      <button id="loginButton">로그인</button>

      <div id="loginMessage"></div>
    </div>

    <!-- 상품 조회 -->
    <div id="mainArea" style="display:none;">

      <h1>SW 상품조회</h1>

      <!-- 검색창 -->
      <div class="search-area">

        <input
          type="text"
          id="searchInput"
          placeholder="상품명 또는 바코드 검색"
        >

        <button id="searchButton">검색</button>

        <!-- 모바일 전용 카메라 버튼 -->
        <button id="scanButton">스캔</button>

      </div>

      <!-- 바코드 카메라 영역 -->
      <div id="scannerArea">

        <div id="reader"></div>

        <p class="scanner-guide">
          상품 바코드를 카메라 화면에 비춰주세요.
        </p>

        <button id="stopScanButton">
          스캔 종료
        </button>

      </div>

      <div class="info-area">
        <div>
          검색 결과 <span id="resultCount">0</span>건
        </div>

        <div id="updateTime">
          데이터 불러오는 중...
        </div>
      </div>

      <!-- PC 테이블 -->
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>상품분류</th>
              <th>바코드</th>
              <th>상품명</th>
              <th>규격</th>
              <th>소매가</th>
            </tr>
          </thead>

          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <!-- 모바일 카드 -->
      <div id="mobileResults"></div>

      <div id="statusMessage"></div>

    </div>
  </div>

  <script>
    const PASSWORD = "2221";

    const SPREADSHEET_ID =
      "12vYM5rzLo_bCiKipLJfX-io3c9ycI9cW18ST07_d6GY";

    const GID = "0";

    let products = [];
    let filteredProducts = [];

    let refreshTimer = null;
    let isLoading = false;

    // 바코드 스캐너 변수
    let barcodeScanner = null;
    let hasScanned = false;

    // 로그인
    document.getElementById("loginButton")
      .addEventListener("click", login);

    document.getElementById("passwordInput")
      .addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
          login();
        }
      });

    function login() {
      const password =
        document.getElementById("passwordInput").value;

      if (password === PASSWORD) {
        document.getElementById("loginArea").style.display = "none";
        document.getElementById("mainArea").style.display = "block";

        loadProducts();

        refreshTimer = setInterval(loadProducts, 60000);

      } else {
        document.getElementById("loginMessage").textContent =
          "비밀번호가 올바르지 않습니다.";
      }
    }

    // Google Sheets 데이터 불러오기
    function loadProducts() {
      if (isLoading) return;

      isLoading = true;

      document.getElementById("statusMessage").textContent =
        "상품 데이터를 불러오는 중입니다...";

      const oldScript =
        document.getElementById("googleSheetScript");

      if (oldScript) {
        oldScript.remove();
      }

      window.google = window.google || {};

      window.google.visualization =
        window.google.visualization || {};

      window.google.visualization.Query =
        window.google.visualization.Query || {};

      window.google.visualization.Query.setResponse =
        function(response) {
          try {
            if (!response || response.status !== "ok") {
              throw new Error("데이터를 불러오지 못했습니다.");
            }

            const rows = response.table.rows || [];

            products = rows.map(function(row) {
              const cells = row.c || [];

              return {
                category: getCellValue(cells[0]),
                barcode: getCellValue(cells[1]),
                name: getCellValue(cells[2]),
                size: getCellValue(cells[3]),
                price: getCellValue(cells[4])
              };
            });

            // 첫 행이 제목 행이면 제거
            if (
              products.length > 0 &&
              products[0].category === "상품분류"
            ) {
              products.shift();
            }

            products = products.filter(function(product) {
              return product.name !== "";
            });

            const keyword =
              document.getElementById("searchInput").value.trim();

            if (keyword) {
              searchProducts();
            } else {
              filteredProducts = products.slice();
              renderProducts();
            }

            document.getElementById("updateTime").textContent =
              "갱신 " + new Date().toLocaleTimeString("ko-KR");

            document.getElementById("statusMessage").textContent =
              "데이터가 정상적으로 업데이트되었습니다.";

          } catch (error) {
            document.getElementById("statusMessage").textContent =
              "데이터 처리 중 오류가 발생했습니다.";
          } finally {
            isLoading = false;

            const script =
              document.getElementById("googleSheetScript");

            if (script) {
              script.remove();
            }
          }
        };

      const url =
        "https://docs.google.com/spreadsheets/d/" +
        SPREADSHEET_ID +
        "/gviz/tq?tqx=out:json&gid=" +
        GID +
        "&headers=0";

      const script = document.createElement("script");

      script.id = "googleSheetScript";
      script.src = url;

      script.onerror = function() {
        isLoading = false;

        document.getElementById("statusMessage").textContent =
          "데이터 연결에 실패했습니다.";
      };

      document.body.appendChild(script);
    }

    // 셀 값 처리
    function getCellValue(cell) {
      if (!cell) return "";

      if (cell.f !== null && cell.f !== undefined) {
        return String(cell.f).trim();
      }

      if (cell.v !== null && cell.v !== undefined) {
        return String(cell.v).trim();
      }

      return "";
    }

    // 바코드 앞자리 0 정규화
    function normalizeBarcode(value) {
      return String(value || "")
        .trim()
        .replace(/\s/g, "")
        .replace(/^0+/, "");
    }

    // 검색 이벤트
    document.getElementById("searchButton")
      .addEventListener("click", searchProducts);

    document.getElementById("searchInput")
      .addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
          searchProducts();
        }
      });

    // 상품 검색
    function searchProducts() {
      const keyword =
        document.getElementById("searchInput").value.trim();

      if (!keyword) {
        filteredProducts = products.slice();
        renderProducts();
        return;
      }

      const searchBarcode = normalizeBarcode(keyword);

      // 바코드 전체 일치 검색
      const barcodeMatches = products.filter(function(product) {
        return normalizeBarcode(product.barcode) === searchBarcode;
      });

      if (/^\d+$/.test(keyword) && barcodeMatches.length > 0) {
        filteredProducts = barcodeMatches;
      } else {
        // 상품명 부분 검색
        const searchName = keyword.toLowerCase();

        filteredProducts = products.filter(function(product) {
          return product.name.toLowerCase().includes(searchName);
        });
      }

      renderProducts();
    }

    // ==============================
    // 모바일 바코드 스캔 기능
    // ==============================

    // 카메라 시작
    document.getElementById("scanButton")
      .addEventListener("click", startBarcodeScanner);

    async function startBarcodeScanner() {

      if (barcodeScanner) return;

      if (!window.Html5Qrcode) {
        alert("바코드 인식 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.");
        return;
      }

      if (!window.isSecureContext) {
        alert("카메라 사용은 HTTPS 환경에서만 가능합니다.");
        return;
      }

      hasScanned = false;

      const scannerArea =
        document.getElementById("scannerArea");

      scannerArea.style.display = "block";

      document.getElementById("scanButton").disabled = true;

      document.getElementById("statusMessage").textContent =
        "카메라를 실행하는 중입니다...";

      barcodeScanner = new Html5Qrcode("reader", {
        formatsToSupport: [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.ITF,
          Html5QrcodeSupportedFormats.CODABAR
        ],
        verbose: false
      });

      try {

        await barcodeScanner.start(
          { facingMode: "environment" },

          {
            fps: 10,
            aspectRatio: 1.7777778
          },

          function(decodedText) {

            // 한 번 인식하면 중복 실행 방지
            if (hasScanned) return;

            hasScanned = true;

            // 검색창에 바코드 입력
            document.getElementById("searchInput").value =
              decodedText;

            document.getElementById("statusMessage").textContent =
              "바코드 인식 완료: " + decodedText;

            // 카메라 종료 후 자동 검색
            stopBarcodeScanner().then(function() {
              searchProducts();
            });

          },

          function(errorMessage) {
            // 인식 중 발생하는 일반적인 오류는 무시
          }
        );

        document.getElementById("statusMessage").textContent =
          "바코드를 카메라에 비춰주세요.";

      } catch (error) {

        await stopBarcodeScanner();

        document.getElementById("statusMessage").textContent =
          "카메라를 실행할 수 없습니다. 카메라 권한을 허용해주세요.";

        alert(
          "카메라 실행에 실패했습니다.\n\n" +
          "브라우저의 카메라 권한을 확인해주세요."
        );
      }
    }

    // 카메라 종료
    document.getElementById("stopScanButton")
      .addEventListener("click", stopBarcodeScanner);

    async function stopBarcodeScanner() {

      if (barcodeScanner) {

        const scanner = barcodeScanner;

        barcodeScanner = null;

        try {
          await scanner.stop();
        } catch (error) {
          // 이미 종료된 경우 무시
        }

        try {
          scanner.clear();
        } catch (error) {
          // 정리 오류 무시
        }
      }

      document.getElementById("scannerArea").style.display =
        "none";

      document.getElementById("scanButton").disabled = false;
    }

    // ==============================
    // 기존 결과 표시 기능
    // ==============================

    // HTML 문자 처리
    function escapeHTML(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // 가격 표시
    function formatPrice(value) {
      const number = Number(
        String(value)
          .replace(/,/g, "")
          .replace(/[^\d.-]/g, "")
      );

      if (value === "" || !Number.isFinite(number)) {
        return escapeHTML(value);
      }

      return number.toLocaleString("ko-KR") + "원";
    }

    // 결과 렌더링
    function renderProducts() {

      const tableBody =
        document.getElementById("tableBody");

      const mobileResults =
        document.getElementById("mobileResults");

      tableBody.innerHTML = "";
      mobileResults.innerHTML = "";

      document.getElementById("resultCount").textContent =
        filteredProducts.length.toLocaleString("ko-KR");

      if (filteredProducts.length === 0) {

        tableBody.innerHTML =
          '<tr><td colspan="5">검색 결과가 없습니다.</td></tr>';

        mobileResults.innerHTML =
          '<div class="empty-message">검색 결과가 없습니다.</div>';

        return;
      }

      filteredProducts.forEach(function(product) {

        // PC 테이블
        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td>${escapeHTML(product.category)}</td>
          <td>${escapeHTML(product.barcode)}</td>
          <td class="product-name">${escapeHTML(product.name)}</td>
          <td>${escapeHTML(product.size)}</td>
          <td class="price">${formatPrice(product.price)}</td>
        `;

        tableBody.appendChild(tr);

        // 모바일 카드
        const card = document.createElement("div");

        card.className = "product-card";

        card.innerHTML = `
          <div class="card-top">
            <span class="category">
              ${escapeHTML(product.category || "분류 없음")}
            </span>

            <span class="card-price">
              ${formatPrice(product.price)}
            </span>
          </div>

          <div class="card-name">
            ${escapeHTML(product.name)}
          </div>

          <div class="card-info">

            <div class="card-info-row">
              <span class="card-label">바코드</span>

              <span class="card-value">
                ${escapeHTML(product.barcode)}
              </span>
            </div>

            <div class="card-info-row">
              <span class="card-label">규격</span>

              <span class="card-value">
                ${escapeHTML(product.size || "-")}
              </span>
            </div>

          </div>
        `;

        mobileResults.appendChild(card);

      });
    }
  </script>
</body>
</html>
