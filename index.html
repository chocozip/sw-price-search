
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SW 상품조회</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, "Malgun Gothic", sans-serif;
      background: #f4f6f9;
      color: #222;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin: 0 0 25px;
      font-size: 28px;
    }

    .login-box {
      max-width: 360px;
      margin: 80px auto;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    button {
      padding: 13px 20px;
      border: none;
      border-radius: 7px;
      background: #2457c5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #19449e;
    }

    .login-box button {
      width: 100%;
    }

    .search-area {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .search-area input {
      margin: 0;
      flex: 1;
      min-width: 0;
    }

    .status {
      margin: 12px 0;
      font-size: 14px;
      color: #666;
    }

    .status.error {
      color: #d93025;
    }

    .status.success {
      color: #188038;
    }

    .table-wrap {
      overflow-x: auto;
      margin-top: 18px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px 10px;
      text-align: center;
      font-size: 14px;
    }

    th {
      background: #eef2f8;
      font-weight: bold;
    }

    td:nth-child(3) {
      text-align: left;
    }

    .count {
      margin-top: 15px;
      font-weight: bold;
      color: #2457c5;
    }

    .hidden {
      display: none;
    }

    .help {
      color: #777;
      font-size: 13px;
      margin-top: 8px;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 18px 12px;
        margin: 10px auto;
      }

      h1 {
        font-size: 23px;
      }

      .search-area {
        flex-direction: column;
      }

      .search-area button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- 로그인 화면 -->
    <div id="loginScreen" class="login-box">
      <h1>SW 상품조회</h1>

      <input
        type="password"
        id="password"
        placeholder="비밀번호를 입력하세요"
        onkeydown="if(event.key === 'Enter') login()"
      >

      <button onclick="login()">로그인</button>

      <p id="loginMessage" class="status error"></p>
    </div>

    <!-- 상품 조회 화면 -->
    <div id="mainScreen" class="hidden">

      <h1>SW 상품조회</h1>

      <div class="search-area">
        <input
          type="text"
          id="searchInput"
          placeholder="상품명 또는 바코드를 입력하세요"
          onkeydown="if(event.key === 'Enter') searchProducts()"
        >

        <button onclick="searchProducts()">검색</button>
        <button onclick="resetSearch()" style="background:#777;">초기화</button>
      </div>

      <p class="help">
        상품명은 일부 검색 가능하며, 바코드는 전체 번호가 일치해야 조회됩니다.
      </p>

      <div id="status" class="status">상품 데이터를 불러오는 중입니다.</div>

      <div class="count" id="count"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>상품분류</th>
              <th>바코드</th>
              <th>상품명</th>
              <th>규격</th>
              <th>소매가</th>
            </tr>
          </thead>

          <tbody id="resultBody">
            <tr>
              <td colspan="5">데이터를 불러오는 중입니다.</td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>

<script>
  // 기본 설정
  const PASSWORD = "2221";

  const SPREADSHEET_ID =
    "12vYM5rzLo_bCiKipLJfX-io3c9ycI9cW18ST07_d6GY";

  const GID = "0";

  const REFRESH_INTERVAL = 60000;

  let products = [];

  // HTML 문자 처리
  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, function(char) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char];
    });
  }

  // 로그인
  function login() {
    const password = document.getElementById("password").value;

    if (password !== PASSWORD) {
      document.getElementById("loginMessage").textContent =
        "비밀번호가 올바르지 않습니다.";
      return;
    }

    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("mainScreen").classList.remove("hidden");

    loadProducts();
  }

  // 바코드 앞자리 0 제거
  function normalizeBarcode(value) {
    return String(value ?? "")
      .trim()
      .replace(/^0+/, "");
  }

  // Google Visualization 데이터 가져오기
  async function loadProducts() {
    const status = document.getElementById("status");

    status.textContent = "상품 데이터를 불러오는 중입니다.";
    status.className = "status";

    const url =
      "https://docs.google.com/spreadsheets/d/" +
      SPREADSHEET_ID +
      "/gviz/tq?tqx=out:json&gid=" +
      GID +
      "&headers=1";

    try {
      const response = await fetch(url, {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error("Google Sheets 응답 오류: " + response.status);
      }

      const responseText = await response.text();

      // JSONP 형태의 응답에서 JSON 부분 추출
      const start = responseText.indexOf("{");
      const end = responseText.lastIndexOf("}");

      if (start === -1 || end === -1) {
        throw new Error("데이터 응답 형식이 올바르지 않습니다.");
      }

      const json = JSON.parse(
        responseText.substring(start, end + 1)
      );

      if (json.status !== "ok") {
        const message =
          json.errors?.[0]?.detailed_message ||
          json.errors?.[0]?.message ||
          "Google Sheets 접근 오류";

        throw new Error(message);
      }

      const table = json.table;

      if (!table || !table.cols) {
        throw new Error("시트 데이터를 확인할 수 없습니다.");
      }

      const headers = table.cols.map((col, index) => {
        return String(col.label || col.id || "").trim();
      });

      const headerIndex = {};

      headers.forEach((header, index) => {
        headerIndex[header] = index;
      });

      const requiredHeaders = [
        "상품분류",
        "바코드",
        "상품명",
        "규격",
        "소매가"
      ];

      const missingHeaders = requiredHeaders.filter(
        header => headerIndex[header] === undefined
      );

      if (missingHeaders.length > 0) {
        throw new Error(
          "시트 열 이름을 확인해 주세요: " +
          missingHeaders.join(", ")
        );
      }

      products = table.rows.map(row => {
        const cells = row.c || [];

        function getValue(header) {
          const index = headerIndex[header];
          const cell = cells[index];

          if (!cell || cell.v === null || cell.v === undefined) {
            return "";
          }

          // 표시 형식이 있으면 우선 사용
          return String(
            cell.f !== undefined ? cell.f : cell.v
          ).trim();
        }

        return {
          category: getValue("상품분류"),
          barcode: getValue("바코드"),
          name: getValue("상품명"),
          size: getValue("규격"),
          price: getValue("소매가")
        };
      }).filter(item => {
        return item.category ||
               item.barcode ||
               item.name ||
               item.size ||
               item.price;
      });

      status.textContent =
        "상품 데이터 " + products.length.toLocaleString() +
        "개를 불러왔습니다.";

      status.className = "status success";

      document.getElementById("count").textContent =
        "전체 상품 수: " + products.length.toLocaleString() + "개";

      // 검색어가 있으면 갱신된 데이터로 다시 검색
      const keyword = document.getElementById("searchInput").value.trim();

      if (keyword) {
        searchProducts();
      } else {
        document.getElementById("resultBody").innerHTML =
          '<tr><td colspan="5">상품명 또는 바코드를 검색해 주세요.</td></tr>';
      }

    } catch (error) {
      console.error("상품 데이터 조회 오류:", error);

      status.textContent =
        "데이터를 불러오지 못했습니다: " + error.message;

      status.className = "status error";

      document.getElementById("resultBody").innerHTML =
        '<tr><td colspan="5">데이터 조회에 실패했습니다.</td></tr>';
    }
  }

  // 상품 검색
  function searchProducts() {
    const keyword = document.getElementById("searchInput").value.trim();

    const resultBody = document.getElementById("resultBody");
    const count = document.getElementById("count");

    if (!keyword) {
      resultBody.innerHTML =
        '<tr><td colspan="5">검색어를 입력해 주세요.</td></tr>';
      return;
    }

    const normalizedKeyword = normalizeBarcode(keyword);

    const isBarcodeSearch = /^[0-9]+$/.test(keyword);

    let results;

    if (isBarcodeSearch) {
      results = products.filter(item => {
        return normalizeBarcode(item.barcode) === normalizedKeyword;
      });
    } else {
      results = products.filter(item => {
        return item.name.toLowerCase().includes(
          keyword.toLowerCase()
        );
      });
    }

    count.textContent =
      "검색 결과: " + results.length.toLocaleString() + "개";

    if (results.length === 0) {
      resultBody.innerHTML =
        '<tr><td colspan="5">검색 결과가 없습니다.</td></tr>';
      return;
    }

    resultBody.innerHTML = results.map(item => {
      return `
        <tr>
          <td>${escapeHTML(item.category)}</td>
          <td>${escapeHTML(item.barcode)}</td>
          <td>${escapeHTML(item.name)}</td>
          <td>${escapeHTML(item.size)}</td>
          <td>${escapeHTML(item.price)}</td>
        </tr>
      `;
    }).join("");
  }

  // 검색 초기화
  function resetSearch() {
    document.getElementById("searchInput").value = "";

    document.getElementById("resultBody").innerHTML =
      '<tr><td colspan="5">상품명 또는 바코드를 검색해 주세요.</td></tr>';

    document.getElementById("count").textContent =
      "전체 상품 수: " + products.length.toLocaleString() + "개";
  }

  // 60초마다 자동 갱신
  setInterval(function() {
    if (!document.getElementById("mainScreen").classList.contains("hidden")) {
      loadProducts();
    }
  }, REFRESH_INTERVAL);

</script>

</body>
</html>
