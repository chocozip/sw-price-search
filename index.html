  <style>
    * {

<body>
  <div class="container">

    <!-- 로그인 -->
    <div id="loginArea">
      <h1>SW 상품조회</h1>
      <input
        type="password"
        id="passwordInput"
        placeholder="비밀번호 입력"
        inputmode="numeric"
      >
      <button id="loginButton">로그인</button>
      <div id="loginMessage"></div>
    </div>

    <!-- 상품 조회 -->
    <div id="mainArea" style="display:none;">
      <h1>SW 상품조회</h1>

      <div class="search-area">
        <input
          type="text"
          id="searchInput"
          placeholder="상품명 또는 바코드 검색"
        >
        <button id="searchButton">검색</button>
      </div>

      <div class="info-area">
        <div>검색 결과 <span id="resultCount">0</span>건</div>
        <div id="updateTime">데이터 불러오는 중...</div>
      </div>

      <!-- PC 테이블 -->
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>상품분류</th>
              <th>바코드</th>
              <th>상품명</th>
              <th>규격</th>
              <th>소매가</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <!-- 모바일 카드 -->
      <div id="mobileResults"></div>

      <div id="statusMessage"></div>
    </div>

  </div>

  <script>
    const PASSWORD = "2221";

    const SPREADSHEET_ID =
      "12vYM5rzLo_bCiKipLJfX-io3c9ycI9cW18ST07_d6GY";

    const GID = "0";

    let products = [];
    let filteredProducts = [];

    let refreshTimer = null;
    let isLoading = false;

    // 로그인
    document.getElementById("loginButton").addEventListener("click", login);

    document.getElementById("passwordInput")
      .addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
          login();
        }
      });

    function login() {
      const password =
        document.getElementById("passwordInput").value;

      if (password === PASSWORD) {
        document.getElementById("loginArea").style.display = "none";
        document.getElementById("mainArea").style.display = "block";

        loadProducts();

        refreshTimer = setInterval(loadProducts, 60000);
      } else {
        document.getElementById("loginMessage").textContent =
          "비밀번호가 올바르지 않습니다.";
      }
    }

    // Google Sheets 데이터 불러오기
    function loadProducts() {
      if (isLoading) return;

      isLoading = true;

      document.getElementById("statusMessage").textContent =
        "상품 데이터를 불러오는 중입니다...";

      const callbackName = "googleVisualizationCallback";

      const oldScript = document.getElementById("googleSheetScript");
      if (oldScript) {
        oldScript.remove();
      }

      window.google = window.google || {};
      window.google.visualization =
        window.google.visualization || {};

      window.google.visualization.Query =
        window.google.visualization.Query || {};

      window.google.visualization.Query.setResponse =
        function(response) {
          try {
            if (!response || response.status !== "ok") {
              throw new Error("데이터를 불러오지 못했습니다.");
            }

            const rows = response.table.rows || [];

            products = rows.map(function(row) {
              const cells = row.c || [];

              return {
                category: getCellValue(cells[0]),
                barcode: getCellValue(cells[1]),
                name: getCellValue(cells[2]),
                size: getCellValue(cells[3]),
                price: getCellValue(cells[4])
              };
            });

            // 첫 행이 제목 행이면 제거
            if (
              products.length > 0 &&
              products[0].category === "상품분류"
            ) {
              products.shift();
            }

            products = products.filter(function(product) {
              return product.name !== "";
            });

            const keyword =
              document.getElementById("searchInput").value.trim();

            if (keyword) {
              searchProducts();
            } else {
              filteredProducts = products.slice();
              renderProducts();
            }

            document.getElementById("updateTime").textContent =
              "갱신 " + new Date().toLocaleTimeString("ko-KR");

            document.getElementById("statusMessage").textContent =
              "데이터가 정상적으로 업데이트되었습니다.";

          } catch (error) {
            document.getElementById("statusMessage").textContent =
              "데이터 처리 중 오류가 발생했습니다.";
          } finally {
            isLoading = false;

            const script =
              document.getElementById("googleSheetScript");

            if (script) {
              script.remove();
            }
          }
        };

      const url =
        "https://docs.google.com/spreadsheets/d/" +
        SPREADSHEET_ID +
        "/gviz/tq?tqx=out:json&gid=" +
        GID +
        "&headers=0";

      const script = document.createElement("script");
      script.id = "googleSheetScript";
      script.src = url;
      script.onerror = function() {
        isLoading = false;

        document.getElementById("statusMessage").textContent =
          "데이터 연결에 실패했습니다.";
      };

      document.body.appendChild(script);
    }

    // 셀 값 처리
    function getCellValue(cell) {
      if (!cell) return "";

      if (cell.f !== null && cell.f !== undefined) {
        return String(cell.f).trim();
      }

      if (cell.v !== null && cell.v !== undefined) {
        return String(cell.v).trim();
      }

      return "";
    }

    // 바코드 앞자리 0 정규화
    function normalizeBarcode(value) {
      return String(value || "")
        .trim()
        .replace(/\s/g, "")
        .replace(/^0+/, "");
    }

    // 검색
    document.getElementById("searchButton")
      .addEventListener("click", searchProducts);

    document.getElementById("searchInput")
      .addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
          searchProducts();
        }
      });

    function searchProducts() {
      const keyword =
        document.getElementById("searchInput").value.trim();

      if (!keyword) {
        filteredProducts = products.slice();
        renderProducts();
        return;
      }

      const searchBarcode = normalizeBarcode(keyword);

      // 바코드 전체 일치 검색
      const barcodeMatches = products.filter(function(product) {
        return normalizeBarcode(product.barcode) === searchBarcode;
      });

      if (/^\d+$/.test(keyword) && barcodeMatches.length > 0) {
        filteredProducts = barcodeMatches;
      } else {
        // 상품명 부분 검색
        const searchName = keyword.toLowerCase();

        filteredProducts = products.filter(function(product) {
          return product.name.toLowerCase().includes(searchName);
        });
      }

      renderProducts();
    }

    // HTML 문자 처리
    function escapeHTML(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // 가격 표시
    function formatPrice(value) {
      const number = Number(
        String(value).replace(/,/g, "").replace(/[^\d.-]/g, "")
      );

      if (value === "" || !Number.isFinite(number)) {
        return escapeHTML(value);
      }

      return number.toLocaleString("ko-KR") + "원";
    }

    // 결과 렌더링
    function renderProducts() {
      const tableBody =
        document.getElementById("tableBody");

      const mobileResults =
        document.getElementById("mobileResults");

      tableBody.innerHTML = "";
      mobileResults.innerHTML = "";

      document.getElementById("resultCount").textContent =
        filteredProducts.length.toLocaleString("ko-KR");

      if (filteredProducts.length === 0) {
        const message =
          '<div class="empty-message">검색 결과가 없습니다.</div>';

        tableBody.innerHTML =
          '<tr><td colspan="5">검색 결과가 없습니다.</td></tr>';

        mobileResults.innerHTML = message;
        return;
      }

      filteredProducts.forEach(function(product) {
        // PC 테이블
        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td>${escapeHTML(product.category)}</td>
          <td>${escapeHTML(product.barcode)}</td>
          <td class="product-name">${escapeHTML(product.name)}</td>
          <td>${escapeHTML(product.size)}</td>
          <td class="price">${formatPrice(product.price)}</td>
        `;

        tableBody.appendChild(tr);

        // 모바일 카드
        const card = document.createElement("div");
        card.className = "product-card";

        card.innerHTML = `
          <div class="card-top">
            <span class="category">
              ${escapeHTML(product.category || "분류 없음")}
            </span>

            <span class="card-price">
              ${formatPrice(product.price)}
            </span>
          </div>

          <div class="card-name">
            ${escapeHTML(product.name)}
          </div>

          <div class="card-info">
            <div class="card-info-row">
              <span class="card-label">바코드</span>
              <span class="card-value">
                ${escapeHTML(product.barcode)}
              </span>
            </div>

            <div class="card-info-row">
              <span class="card-label">규격</span>
              <span class="card-value">
                ${escapeHTML(product.size || "-")}
              </span>
            </div>
          </div>
        `;

        mobileResults.appendChild(card);
      });
    }
  </script>
</body>
</html>
